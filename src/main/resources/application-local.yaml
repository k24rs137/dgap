spring:
  datasource:
    url: jdbc:h2:file:./target/dgap-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
