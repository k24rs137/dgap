<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja" th:lang="${lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lang == 'en' ? 'Lesson Navigator' : (lang == 'ko' ? '학습 상담 내비' : '学習相談ナビ')}">学習相談ナビ</title>
    <link rel="stylesheet" th:href="@{/style.css(v='20261005-1')}">
</head>
<body class="designed-page ai-redesign-page">
<header class="site-header">
    <div class="header-inner">
        <a class="site-logo" th:href="@{/(lang=${lang})}"><span class="site-logo-mark">D</span><span>D-Gap</span></a>
        <nav class="desktop-nav" aria-label="メインメニュー">
            <a th:href="@{/(lang=${lang})}" th:text="${lang == 'en' ? 'Home' : 'トップ'}">トップ</a>
            <a th:href="@{/diagnosis(lang=${lang})}" th:text="${lang == 'en' ? 'Trouble check' : '困りごと診断'}">困りごと診断</a>
            <a th:href="@{/community(lang=${lang})}" th:text="${lang == 'en' ? 'Community' : 'コミュニティ'}">コミュニティ</a>
            <a th:href="@{/fraud(lang=${lang})}" th:text="${lang == 'ko' ? '사기 메일 진단' : (lang == 'en' ? 'Scam email check' : (lang == 'hira' ? 'あぶないめーるしんだん' : '詐欺メール診断'))}">詐欺メール診断</a>
        </nav>
        <div class="header-actions"><a class="button button-small button-primary" th:href="@{/login(lang=${lang})}" th:text="${lang == 'en' ? 'Log in' : 'ログイン'}">ログイン</a></div>
    </div>
</header>
<main class="designed-main ai-main">
    <section class="ai-lab-shell">
        <div class="ai-lab-hero reveal">
            <p class="designed-kicker">LESSON NAVIGATOR</p>
            <h1 th:text="${lang == 'en' ? 'Describe your issue and find a lesson' : '困りごとからレッスンを探す'}">困りごとからレッスンを探す</h1>
            <p th:text="${lang == 'en' ? 'This is a keyword-based lesson finder, not a generative AI service.' : '入力したキーワードから関連レッスンを案内する機能です。生成AIによる回答ではありません。'}">キーワード型の案内機能です。</p>
        </div>
        <div class="ai-lab-grid">
            <section class="ai-chat-panel reveal" data-tilt-card>
                <div class="ai-orb-wrap"><div class="ai-orb"></div><span th:text="${lang == 'en' ? 'Navigator' : '相談ナビ'}">相談ナビ</span></div>
                <textarea id="aiInput" rows="6" maxlength="300" th:placeholder="${lang == 'en' ? 'Example: I want to send an email' : '例：メールを送りたい、道を調べたい'}"></textarea>
                <div class="ai-action-row">
                    <button type="button" id="voiceButton" class="design-button design-button-soft" th:text="${lang == 'en' ? 'Voice input' : '音声入力'}">音声入力</button>
                    <button type="button" id="aiButton" class="design-button design-button-solid" th:text="${lang == 'en' ? 'Find lessons' : 'レッスンを探す'}">レッスンを探す</button>
                </div>
            </section>
            <section class="ai-result-stack">
                <article class="ai-result-card reveal"><p class="section-label">RESULT</p><h2 th:text="${lang == 'en' ? 'Recommended lessons' : 'おすすめレッスン'}">おすすめレッスン</h2><div id="aiResult"></div></article>
                <article class="ai-history-card reveal"><p class="section-label">HISTORY</p><h2 th:text="${lang == 'en' ? 'Search history' : '相談履歴'}">相談履歴</h2><div id="aiHistory"></div></article>
            </section>
        </div>
        <div class="designed-back-area"><a class="design-button design-button-solid" th:href="@{/(lang=${lang})}" th:text="${lang == 'en' ? 'Back to home' : 'トップへ戻る'}">トップへ戻る</a></div>
    </section>
</main>
<script th:src="@{/account-sync.js(v='20260930')}"></script>
<script th:src="@{/ai.js(v='20260930')}"></script>
<script th:src="@{/script.js(v='20261005-1')}"></script>
</body>
</html>
